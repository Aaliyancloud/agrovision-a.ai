<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgroVision AI — Offline Mode</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #faf8f2;
        color: #13281c;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        max-width: 400px;
        background: #ffffff;
        border: 1px solid #cbdcd0;
        border-radius: 24px;
        padding: 28px 24px;
        text-align: center;
        box-shadow: 0 12px 32px rgba(19, 40, 28, 0.08);
      }
      .badge {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 999px;
        background: #edf5ef;
        color: #166534;
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 12px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 22px;
      }
      p {
        margin: 0 0 20px;
        font-size: 14px;
        line-height: 1.5;
        color: #3d5947;
      }
      button {
        width: 100%;
        padding: 12px 18px;
        border: none;
        border-radius: 14px;
        background: #166534;
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">AgroVision AI · Offline Standby</div>
      <h1>Connect Once to Sync Field Cache</h1>
      <p>
        Open the app once with internet access to cache the tomato leaf scanner, 10+ care guides, and Field Log for full offline field use.
      </p>
      <button onclick="window.location.href='https://agrovision-a.ai.studio/?mode=app'">
        Retry Connection
      </button>
    </div>
  </body>
</html>
