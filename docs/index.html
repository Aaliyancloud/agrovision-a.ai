        <ul>
          <li>Healthy Tomato Foliage (Solanum lycopersicum)</li>

          <li>Late Blight (Phytophthora infestans)</li>

          <li>Septoria Leaf Spot (Septoria lycopersici)</li>
          <li>Tomato Yellow Leaf Curl Virus (TYLCV)</li>
          <li>Leaf Mold (Passalora fulva)</li>
          <li>Two-Spotted Spider Mite (Tetranychus urticae)</li>
          <li>Target Spot (Corynespora cassiicola)</li>
